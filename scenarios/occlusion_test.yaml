# AI detection / Target Lost / Redetection の確認 (spec v2.0 §48)
#
# 外周ループに **obstacle_2 を U 字に迂回する区間**を組み込む。
# 迂回区間では障害物から 0.40 m を通るため、1.5-1.7 m 後方の Follower から
# 見て視線が遮られ、DETECTED -> LOST -> REDETECTED が発生する。
#
# なぜこの形なのか (いずれも幾何計算と実測で決めた):
#
# 1. 遮蔽には **クリアランス < 機体間隔/4** が必要
#    コーナーで視線が角から内側へ食い込む量は約 s/(2*sqrt(2)) で、
#    **障害物の大きさには依存しない**。
#    **機体間隔は設定値 (follow_distance 1.0 m) ではなく実際の距離**。
#    Follower は目標より後ろを走るので実測は 1.5-1.7 m で、
#    条件は 0.38-0.42 m 未満。クリアランス 0.40 m はこの範囲の際にある。
#    大きな障害物を広いクリアランスで回っても遮蔽は起きない。
#
# 2. 走行には **クリアランス > inflation_radius** が必要
#    0.45 では 0.40 m の経路が膨張領域に入り、planner が外側へ膨らんで
#    遮蔽が消える。inflation_radius を 0.35 に下げて窓を作った (DEVLOG N-10)。
#
# 3. 周長は **機体間隔の 10 倍以上** 必要
#    障害物を周回するだけの短いループ (6.1 m = 機体間隔の 3.6 倍) にすると、
#    Leader が 1 周して Follower に追いつき、互いを障害物として認識して
#    両者が停止した (実測: 両機が 0.557 m で凍結)。
#    この構成は周長 24.2 m。実測間隔 1.5-1.7 m に対して 14-16 倍。
#
# 実測した遮蔽 (実測間隔 1.68 m / Leader 0.25 m/s 時代の計測):
#   遮蔽率 4.0% / 1 周あたり 2 区間 / 最長連続 1.9 s / 1 周 96 s
#
# SEARCHING (search_timeout 3.0 s) は**発生する**。
# 当初「この幾何では発生しない」と書いていたが、Leader を 0.35 m/s に
# 上げた現構成では 300 s あたり 3-5 回観測される。
# 追従距離を上げた場合の比較は occlusion_far.yaml と EXERCISE 7 を参照。
#
# 座標は scripts/check_scenarios.py で検査している。
name: occlusion_test
description: 外周ループに障害物の U 字迂回を組み込み、Target Lost と Redetection を発生させる。
world: demo_world.sdf
duration_sec: 300

leader:
  initial_pose: {x: -1.8, y: -3.0, yaw: 0.0}
  speed_limit: 0.35
  loop: true
  waypoints:
    - {x:  3.0, y: -3.0, yaw: 1.5708}   # 南側を東進
    - {x:  3.0, y:  1.5, yaw: 3.1416}   # 東側を北上
    - {x:  2.4, y:  1.5, yaw: 1.5708}   # 迂回開始: obstacle_2 の東側へ
    - {x:  2.4, y:  3.1, yaw: 3.1416}   # 東側を北上 (遮蔽区間)
    - {x:  0.8, y:  3.1, yaw: -1.5708}  # 北側を西進 (遮蔽区間)
    - {x:  0.8, y:  1.5, yaw: 3.1416}   # 西側を南下
    - {x: -3.0, y:  1.5, yaw: -1.5708}  # 迂回終了: 西へ抜ける
    - {x: -3.0, y: -3.0, yaw: 0.0}      # 西側を南下
    - {x: -1.8, y: -3.0, yaw: 0.0}      # 南側へ戻って周回

follower:
  # spec §41 / §49 の標準値 1.0 m を維持する
  spawn_offset: {x: -1.2, y: 0.0}
  follow_distance: 1.0
  speed_limit: 0.50
