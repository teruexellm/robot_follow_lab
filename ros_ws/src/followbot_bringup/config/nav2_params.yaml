# Nav2 パラメータのテンプレート (spec v2.0 §42)
#
# このファイルはそのまま使わない。nav2.launch.py が以下のプレースホルダを
# 置換して /tmp/nav2_<ns>.yaml を生成する。
#
#   __NS__         : namespace (leader / follower)
#   __MAX_VEL_X__  : 最大前進速度 [m/s]
#   __XY_GOAL_TOL__: ゴール到達判定の位置許容 [m]
#                    Follower は追従距離を詰めるため Leader より小さくする
#   __INIT_X__ __INIT_Y__ __INIT_YAW__ : AMCL の初期姿勢 (scenario YAML 由来)
#
# 設計上の前提:
#   * map フレームは 2 台で共有する単一フレーム。odom / base_* は "<ns>/" prefix 付き。
#     /tf も共有（namespace ごとに tf を分けない）。
#   * map_server は全体で 1 つだけ起動し、両機の global_costmap が /map を購読する。
#   * controller は DWB、planner は NavFn を使う。
#     MPPI (nav2_mppi_controller) は**このイメージに存在しない**ため、
#     nav2_bringup 既定の nav2_params.yaml はそのままでは動かない。
#   * diff_drive_controller は geometry_msgs/TwistStamped しか受け付けないため、
#     cmd_vel を publish する側すべてで enable_stamped_cmd_vel: true を指定する。

__NS__:

  # ---------------- 自己位置推定 (spec §15: SLAM は使わない) ----------------
  amcl:
    ros__parameters:
      use_sim_time: true
      base_frame_id: "__NS__/base_footprint"
      odom_frame_id: "__NS__/odom"
      global_frame_id: "map"
      scan_topic: "/__NS__/scan"
      # 既定値は相対名 "map" -> namespace が付いて /__NS__/map を購読してしまい、
      # 全体共有の map_server (/map) と噛み合わない。絶対名で指定する (DEVLOG N-5)。
      map_topic: "/map"

      # 初期姿勢を与える。与えないと /initialpose を待って動けない。
      set_initial_pose: true
      initial_pose:
        x: __INIT_X__
        y: __INIT_Y__
        z: 0.0
        yaw: __INIT_YAW__

      # CPU 節約のため粒子数を既定(500-2000)より絞る
      min_particles: 200
      max_particles: 800
      update_min_a: 0.2
      update_min_d: 0.25
      resample_interval: 1

      laser_model_type: "likelihood_field"
      laser_likelihood_max_dist: 2.0
      laser_max_range: 8.0
      # 自機の車体前面 (±98 deg, 約 0.11 m) と車輪 (±146 deg, 約 0.22 m) を
      # LiDAR が検出するため、それより遠い距離から有効にする (DEVLOG S-8)。
      # 車体半径 0.24 m なので 0.30 m 未満の情報を捨てても実害はない。
      laser_min_range: 0.30
      max_beams: 60
      z_hit: 0.5
      z_rand: 0.5
      z_max: 0.05
      z_short: 0.05
      sigma_hit: 0.2
      lambda_short: 0.1

      robot_model_type: "nav2_amcl::DifferentialMotionModel"
      alpha1: 0.2
      alpha2: 0.2
      alpha3: 0.2
      alpha4: 0.2
      alpha5: 0.2

      tf_broadcast: true
      transform_tolerance: 1.0
      pf_err: 0.05
      pf_z: 0.99
      recovery_alpha_fast: 0.0
      recovery_alpha_slow: 0.0
      always_reset_initial_pose: false
      first_map_only: false

  # ---------------- 局所計画・障害物回避 ----------------
  controller_server:
    ros__parameters:
      use_sim_time: true
      # 4 コアで 2 台ぶん動かすと 10 Hz を維持できず
      # "Control loop missed its desired rate" が出た (実測 7.14 Hz)。
      # 達成可能な値にする。指令が間に合わないほうが追従性能に悪い。
      controller_frequency: 7.0
      enable_stamped_cmd_vel: true        # diff_drive_controller は TwistStamped のみ
      odom_topic: "/__NS__/odom"
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3

      progress_checker_plugins: ["progress_checker"]
      goal_checker_plugins: ["general_goal_checker"]
      controller_plugins: ["FollowPath"]

      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.5
        movement_time_allowance: 15.0

      general_goal_checker:
        plugin: "nav2_controller::SimpleGoalChecker"
        stateful: true
        xy_goal_tolerance: __XY_GOAL_TOL__
        yaw_goal_tolerance: 0.6         # 追従では方位は厳しくしない

      FollowPath:
        plugin: "dwb_core::DWBLocalPlanner"
        debug_trajectory_details: false

        min_vel_x: 0.0                  # 後退しない (教材として挙動を分かりやすくする)
        min_vel_y: 0.0
        max_vel_x: __MAX_VEL_X__
        max_vel_y: 0.0
        max_vel_theta: 1.2
        min_speed_xy: 0.0
        max_speed_xy: __MAX_VEL_X__
        min_speed_theta: 0.0

        acc_lim_x: 1.0
        acc_lim_y: 0.0
        acc_lim_theta: 2.0
        decel_lim_x: -1.5
        decel_lim_y: 0.0
        decel_lim_theta: -2.5

        vx_samples: 8          # CPU 節約 (既定 12 から削減)
        vy_samples: 1
        vtheta_samples: 15     # CPU 節約 (既定 20 から削減)
        sim_time: 1.5
        linear_granularity: 0.05
        angular_granularity: 0.025
        transform_tolerance: 0.3
        xy_goal_tolerance: __XY_GOAL_TOL__
        trans_stopped_velocity: 0.1
        short_circuit_trajectory_evaluation: true
        stateful: true

        critics: ["RotateToGoal", "Oscillation", "BaseObstacle",
                  "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
        BaseObstacle.scale: 0.02
        PathAlign.scale: 32.0
        PathAlign.forward_point_distance: 0.15
        GoalAlign.scale: 24.0
        GoalAlign.forward_point_distance: 0.15
        PathDist.scale: 32.0
        GoalDist.scale: 24.0
        RotateToGoal.scale: 32.0
        RotateToGoal.slowing_factor: 5.0
        RotateToGoal.lookahead_time: -1.0

  local_costmap:
    local_costmap:
      ros__parameters:
        use_sim_time: true
        global_frame: "__NS__/odom"
        robot_base_frame: "__NS__/base_link"
        update_frequency: 5.0           # 既定 5 Hz
        publish_frequency: 1.0          # 可視化用。CPU 節約のため低め
        rolling_window: true
        width: 4
        height: 4
        resolution: 0.05
        robot_radius: 0.24              # 車体 0.35x0.28 の外接円 ≒ 0.224 に余裕
        transform_tolerance: 0.3
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: "/__NS__/scan"
            sensor_frame: "__NS__/lidar_link"
            max_obstacle_height: 0.5
            clearing: true
            marking: true
            data_type: "LaserScan"
            raytrace_max_range: 8.5
            raytrace_min_range: 0.30
            obstacle_max_range: 6.0
            obstacle_min_range: 0.30   # 自機ヒットを障害物として置かない
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          # 0.45 から 0.35 へ下げた (DEVLOG N-10)。
          # 車体半径 0.24 m / 8m 四方の部屋に対して 0.45 は過大で、
          # occlusion_test が要求する「障害物から 0.40 m を通る経路」が
          # 膨張領域の内側に入り DWB が進めなくなっていた
          # (controller_server: Failed to make progress)。
          # 遮蔽を起こす条件 (クリアランス < 機体間隔/4 = 0.42 m) と
          # 走行できる条件 (クリアランス > inflation_radius) を
          # 両立させるために 0.35 とする。
          # 機体間隔は設定値 (follow_distance 1.0 m) ではなく実測
          # (1.5-1.7 m)。Follower は目標より後ろを走る (DEVLOG S-17)。
          inflation_radius: 0.35
        always_send_full_costmap: true

  global_costmap:
    global_costmap:
      ros__parameters:
        use_sim_time: true
        global_frame: "map"
        robot_base_frame: "__NS__/base_link"
        update_frequency: 1.0
        publish_frequency: 0.5
        resolution: 0.05
        robot_radius: 0.24
        track_unknown_space: true
        transform_tolerance: 0.3
        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_topic: "/map"             # 全体で 1 つの map_server を共有する
          map_subscribe_transient_local: true
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: "/__NS__/scan"
            sensor_frame: "__NS__/lidar_link"
            max_obstacle_height: 0.5
            clearing: true
            marking: true
            data_type: "LaserScan"
            raytrace_max_range: 8.5
            raytrace_min_range: 0.30
            obstacle_max_range: 6.0
            obstacle_min_range: 0.30   # 自機ヒットを障害物として置かない
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          # 0.45 から 0.35 へ下げた (DEVLOG N-10)。
          # 車体半径 0.24 m / 8m 四方の部屋に対して 0.45 は過大で、
          # occlusion_test が要求する「障害物から 0.40 m を通る経路」が
          # 膨張領域の内側に入り DWB が進めなくなっていた
          # (controller_server: Failed to make progress)。
          # 遮蔽を起こす条件 (クリアランス < 機体間隔/4 = 0.42 m) と
          # 走行できる条件 (クリアランス > inflation_radius) を
          # 両立させるために 0.35 とする。
          inflation_radius: 0.35
        always_send_full_costmap: true

  # ---------------- 大域計画 ----------------
  planner_server:
    ros__parameters:
      use_sim_time: true
      expected_planner_frequency: 2.0
      planner_plugins: ["GridBased"]
      GridBased:
        plugin: "nav2_navfn_planner::NavfnPlanner"
        tolerance: 0.5
        use_astar: false
        allow_unknown: true

  # ---------------- 復帰行動 ----------------
  behavior_server:
    ros__parameters:
      use_sim_time: true
      # **ノードレベルで指定する**。nav2_util::TwistPublisher は
      # declare_parameter_if_not_declared(node, "enable_stamped_cmd_vel", false)
      # でノードのパラメータを読む。プラグイン名の下に書いても効かない。
      # 効いていなかった間、behavior_server は Twist を publish しており
      # diff_drive_controller (TwistStamped) が無視していたため、
      # Spin / BackUp / DriveOnHeading が一切動いていなかった (DEVLOG N-15)。
      enable_stamped_cmd_vel: true
      local_frame: "__NS__/odom"
      global_frame: "map"
      robot_base_frame: "__NS__/base_link"
      transform_tolerance: 0.3
      local_costmap_topic: "local_costmap/costmap_raw"
      local_footprint_topic: "local_costmap/published_footprint"
      global_costmap_topic: "global_costmap/costmap_raw"
      global_footprint_topic: "global_costmap/published_footprint"
      cycle_frequency: 10.0
      behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
      spin:
        plugin: "nav2_behaviors::Spin"
      backup:
        plugin: "nav2_behaviors::BackUp"
      drive_on_heading:
        plugin: "nav2_behaviors::DriveOnHeading"
      wait:
        plugin: "nav2_behaviors::Wait"
      simulate_ahead_time: 2.0
      max_rotational_vel: 1.0
      min_rotational_vel: 0.4
      rotational_acc_lim: 2.0

  # ---------------- Behavior Tree ----------------
  bt_navigator:
    ros__parameters:
      use_sim_time: true
      global_frame: "map"
      robot_base_frame: "__NS__/base_link"
      odom_topic: "/__NS__/odom"
      bt_loop_duration: 10
      default_server_timeout: 20
      wait_for_service_timeout: 1000
      # 追従では GoalUpdater 方式の BT を使う (spec §42, DEVLOG T-4)。
      # Leader は Nav2 既定の BT のままにする必要があるため、
      # nav2.launch.py が namespace ごとに置換する。
      default_nav_to_pose_bt_xml: "__NAV_TO_POSE_BT__"
      # GoalReached の判定半径。追従距離に到達したら走るのをやめる
      goal_reached_tol: 0.25
      navigators: ["navigate_to_pose", "navigate_through_poses"]
      navigate_to_pose:
        plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
      navigate_through_poses:
        plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
